<!--META {"need":"insurance","see_also":["ev-vs-gas","total-cost-of-ownership","maintenance-planner"]} -->
<div data-tool="fuel"><div class="calc"><div class="calc-in"><div class="calc-top"><h2>Your numbers</h2>{{currency}}</div>
<div class="row"><div><label class="label">Distance unit</label><div class="seg" data-for="unit"><button type="button" data-v="mi" aria-pressed="true">Miles</button><button type="button" data-v="km" aria-pressed="false">Kilometres</button></div></div>
<div><label class="label">Fuel economy unit</label><div class="seg" data-for="effunit"><button type="button" data-v="mpg" aria-pressed="true">mpg</button><button type="button" data-v="l100" aria-pressed="false">L/100 km</button></div></div></div><input type="hidden" name="unit" value="mi"><input type="hidden" name="effunit" value="mpg"><div class="field"><label for="u-dist">Trip distance</label><input id="u-dist" name="distance" type="number" inputmode="decimal" value="300" min="0" step="1"></div>
<div class="row"><div class="field"><label for="u-eff">Fuel economy <span class="hint">(e.g. 30 mpg or 7.8 L/100 km)</span></label><input id="u-eff" name="eff" type="number" inputmode="decimal" value="30" min="0.1" step="0.1"></div>
<div class="field"><label for="u-price">Fuel price <span class="hint" data-price-unit>per gallon</span></label><input id="u-price" name="price" type="number" inputmode="decimal" value="3.50" min="0" step="0.01"></div></div>
<div class="row"><div class="field"><label for="u-people">People sharing the cost</label><input id="u-people" name="people" type="number" inputmode="decimal" value="1" min="1" step="1"></div>
<div class="field"><label class="label">&nbsp;</label><label class="check"><input type="checkbox" name="round"> <span>Round trip (double the distance)</span></label></div></div>{{email_results}}</div>
<div class="calc-out" id="results"><h2>Fuel cost</h2>
<p class="readout" data-o="cost">—</p><p class="readout-sub" data-o="sub"></p><ul class="kv"><li><span>Fuel used</span><b data-o="used">—</b></li>
<li><span>Cost per person</span><b data-o="per">—</b></li>
<li><span>Cost per distance</span><b data-o="perdist">—</b></li></ul><a class="btn btn-go" href="{{root}}tools/ev-vs-gas.html">Compare with an EV</a></div></div></div>
